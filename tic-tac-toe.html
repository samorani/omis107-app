<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f2418;
    color: #e8f5e9;
  }
  h1 { margin: 0 0 10px; }
  #status { font-size: 1.3rem; margin-bottom: 16px; min-height: 1.6em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
  }
  .cell {
    background: #1b3d2a;
    border: none;
    border-radius: 10px;
    font-size: 3rem;
    font-weight: bold;
    cursor: pointer;
    color: #e8f5e9;
    transition: background 0.15s;
  }
  .cell:hover:not(:disabled) { background: #26553a; }
  .cell:disabled { cursor: default; }
  .cell.win { background: #fbc02d; color: #0f2418; }
  .controls { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
  button.ctrl, select {
    padding: 8px 16px;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    background: #2e7d32;
    color: #fff;
    cursor: pointer;
  }
  button.ctrl:disabled { opacity: 0.5; cursor: default; }
  .pickers { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
  .pickers label { display: flex; gap: 6px; align-items: center; }
  .pickers select { font-size: 1.4rem; padding: 4px 8px; }
  #score { margin-top: 16px; font-size: 1rem; opacity: 0.85; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div class="pickers">
    <label>Player 1 <select id="emojiX"></select></label>
    <label>Player 2 <select id="emojiO"></select></label>
  </div>
  <div id="status"></div>
  <div id="board"></div>
  <div class="controls">
    <select id="mode">
      <option value="pvp">2 Players</option>
      <option value="cpu">vs Computer</option>
    </select>
    <select id="difficulty" hidden>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard" selected>Hard</option>
    </select>
    <button class="ctrl" id="resign">Resign</button>
    <button class="ctrl" id="reset">New Game</button>
  </div>
  <div id="score"></div>

<script>
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const scoreEl = document.getElementById('score');
  const modeEl = document.getElementById('mode');
  const difficultyEl = document.getElementById('difficulty');
  const resignEl = document.getElementById('resign');

  // Internally the players stay 'X' and 'O'; these pickers choose the emoji shown for each
  const EMOJIS = ['❌','⭕','🐶','🐱','🦊','🐸','🐼','🦄','🍕','🍩','🔥','⚽','🚀','👻','⭐','🤖'];
  const pickerEls = { X: document.getElementById('emojiX'), O: document.getElementById('emojiO') };
  const symbol = p => pickerEls[p].value;

  for (const [p, def] of [['X', '❌'], ['O', '⭕']]) {
    for (const e of EMOJIS) pickerEls[p].add(new Option(e, e, false, e === def));
  }

  // Grey out each player's emoji in the other's picker so both can't pick the same one
  function syncPickers() {
    for (const [p, q] of [['X', 'O'], ['O', 'X']]) {
      for (const opt of pickerEls[p].options) opt.disabled = opt.value === symbol(q);
    }
  }

  let board, current, gameOver, cpuTimer;
  const score = { X: 0, O: 0, draw: 0 };

  function init() {
    clearTimeout(cpuTimer); // drop any computer move still pending from the last game
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    render();
  }

  function winnerOf(b) {
    for (const line of LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line };
    }
    return b.every(Boolean) ? { player: 'draw' } : null;
  }

  function play(i) {
    if (gameOver || board[i]) return;
    board[i] = current;
    const result = winnerOf(board);
    if (result) {
      gameOver = true;
      score[result.player]++;
      render(result);
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    render();
    if (modeEl.value === 'cpu' && current === 'O') {
      cpuTimer = setTimeout(() => play(cpuMove()), 300);
    }
  }

  // The player whose turn it is concedes; the opponent wins
  function resign() {
    if (gameOver) return;
    gameOver = true;
    const winner = current === 'X' ? 'O' : 'X';
    score[winner]++;
    render({ player: winner, resigned: current });
  }

  // Minimax AI (unbeatable)
  function minimax(b, player) {
    const r = winnerOf(b);
    if (r) return r.player === 'O' ? 10 : r.player === 'X' ? -10 : 0;
    const scores = [];
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = player;
        scores.push(minimax(b, player === 'O' ? 'X' : 'O'));
        b[i] = null;
      }
    }
    return player === 'O' ? Math.max(...scores) : Math.min(...scores);
  }

  function bestMove() {
    let best = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'O';
        const s = minimax(board, 'X');
        board[i] = null;
        if (s > best) { best = s; move = i; }
      }
    }
    return move;
  }

  function randomMove() {
    const empty = board.map((v, i) => v ? null : i).filter(i => i !== null);
    return empty[Math.floor(Math.random() * empty.length)];
  }

  // Square that completes a line for player, or -1
  function finishingMove(player) {
    for (const [a, b, c] of LINES) {
      const vals = [board[a], board[b], board[c]];
      if (vals.filter(v => v === player).length === 2 && vals.includes(null)) {
        return [a, b, c][vals.indexOf(null)];
      }
    }
    return -1;
  }

  // Easy: random. Medium: win or block if possible, else random. Hard: minimax.
  function cpuMove() {
    const level = difficultyEl.value;
    if (level === 'hard') return bestMove();
    if (level === 'medium') {
      const win = finishingMove('O');
      if (win >= 0) return win;
      const block = finishingMove('X');
      if (block >= 0) return block;
    }
    return randomMove();
  }

  let lastResult;
  function render(result) {
    lastResult = result;
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.textContent = val ? symbol(val) : '';
      const cpuTurn = modeEl.value === 'cpu' && current === 'O';
      btn.disabled = gameOver || !!val || cpuTurn;
      if (result && result.line && result.line.includes(i)) btn.classList.add('win');
      btn.addEventListener('click', () => play(i));
      boardEl.appendChild(btn);
    });

    resignEl.disabled = gameOver || (modeEl.value === 'cpu' && current === 'O');

    if (result && result.resigned) {
      statusEl.textContent = `${symbol(result.resigned)} resigned. ${symbol(result.player)} wins!`;
    } else if (result) {
      statusEl.textContent = result.player === 'draw' ? "It's a draw!" : `${symbol(result.player)} wins!`;
    } else {
      statusEl.textContent = `${symbol(current)}'s turn`;
    }
    scoreEl.textContent = `${symbol('X')}: ${score.X}   |   ${symbol('O')}: ${score.O}   |   Draws: ${score.draw}`;
  }

  function resetScore() {
    score.X = score.O = score.draw = 0;
    init();
  }

  document.getElementById('reset').addEventListener('click', init);
  resignEl.addEventListener('click', resign);
  modeEl.addEventListener('change', () => {
    difficultyEl.hidden = modeEl.value !== 'cpu';
    resetScore();
  });
  difficultyEl.addEventListener('change', resetScore);
  difficultyEl.hidden = modeEl.value !== 'cpu';
  for (const el of Object.values(pickerEls)) {
    el.addEventListener('change', () => { syncPickers(); render(lastResult); });
  }
  syncPickers();

  init();
</script>
</body>
</html>
